<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q</title>

<style>
:root {
    --green: #22c55e;
    --yellow: #facc15;
    --red: #ef4444;
    --text: #111827;
    --card-bg: rgba(255,255,255,0.92);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text);
    transition: background-color 300ms ease;
    padding: 20px;
}

body.green {
    background: #d4f6e2;
}

body.yellow {
    background: #fff2b3;
}

body.red {
    background: #ffd6d6;
}

.container {
    width: min(92vw, 720px);
}

.card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

.traffic-light {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 36px;
}

.light {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.45;
    transition: all 220ms ease;
    border: 3px solid rgba(255,255,255,0.85);
}

.light:hover {
    transform: scale(1.08);
}

.light.active {
    opacity: 1;
    transform: scale(1.15);
    box-shadow:
        0 0 0 8px rgba(255,255,255,0.65),
        0 8px 20px rgba(0,0,0,0.12);
}

.light.green {
    background: var(--green);
}

.light.yellow {
    background: var(--yellow);
}

.light.red {
    background: var(--red);
}

.question-container {
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.question {
    text-align: center;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    line-height: 1.5;
    font-weight: 500;
    max-width: 90%;
}

.actions {
    display: flex;
    justify-content: center;
    margin-top: 16px;
}

.refresh-btn {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 2.4rem;
    color: #6b7280;
    transition: all 220ms ease;
}

.refresh-btn:hover {
    transform: rotate(90deg) scale(1.1);
    color: #111827;
}

.refresh-btn:active {
    transform: rotate(180deg) scale(0.95);
}

@media (max-width: 600px) {
    .card {
        padding: 24px 20px;
    }

    .light {
        width: 58px;
        height: 58px;
    }

    .question-container {
        min-height: 260px;
    }
}
</style>
</head>

<body class="green">

<div class="container">
    <div class="card">

        <div class="traffic-light">
            <div class="light green active" data-category="green"></div>
            <div class="light yellow" data-category="yellow"></div>
            <div class="light red" data-category="red"></div>
        </div>

        <div class="question-container">
            <div id="question" class="question"></div>
        </div>

        <div class="actions">
            <button
                id="refreshBtn"
                class="refresh-btn"
                aria-label="Show another question"
                title="Show another question">
                ↻
            </button>
        </div>

    </div>
</div>

<script>
const questions = JSON.parse(
    document.getElementById('questions-data').textContent
);

let currentCategory = "green";
let previousQuestion = null;

const questionEl = document.getElementById("question");

function getRandomQuestion(category) {
    const list = questions[category];

    if (!list || list.length === 0) {
        return "No questions available.";
    }

    if (list.length === 1) {
        return list[0];
    }

    let candidate;

    do {
        candidate = list[Math.floor(Math.random() * list.length)];
    } while (candidate === previousQuestion);

    return candidate;
}

function showQuestion() {
    const question = getRandomQuestion(currentCategory);
    previousQuestion = question;

    questionEl.animate(
        [
            {
                opacity: 0,
                transform: "translateY(8px)"
            },
            {
                opacity: 1,
                transform: "translateY(0)"
            }
        ],
        {
            duration: 250,
            easing: "ease-out"
        }
    );

    questionEl.textContent = question;
}

function selectCategory(category) {
    currentCategory = category;
    previousQuestion = null;

    document.body.className = category;

    document
        .querySelectorAll(".light")
        .forEach(light => {
            light.classList.toggle(
                "active",
                light.dataset.category === category
            );
        });

    if (navigator.vibrate) {
        navigator.vibrate(20);
    }

    showQuestion();
}

document.querySelectorAll(".light").forEach(light => {
    light.addEventListener("click", () => {
        selectCategory(light.dataset.category);
    });
});

document
    .getElementById("refreshBtn")
    .addEventListener("click", () => {
        if (navigator.vibrate) {
            navigator.vibrate(15);
        }
        showQuestion();
    });

// Initial question
showQuestion();
</script>
